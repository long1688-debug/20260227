<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>服务状态 - 实训教学系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #00D9FF 0%, #00B4D8 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #00D9FF 0%, #00B4D8 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .content {
            padding: 40px;
        }

        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .status-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #00D9FF;
        }

        .status-card.healthy {
            border-left-color: #48bb78;
        }

        .status-card.warning {
            border-left-color: #ed8936;
        }

        .status-card.error {
            border-left-color: #f56565;
        }

        .status-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .status-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
        }

        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        .status-badge.healthy {
            background: #c6f6d5;
            color: #22543d;
        }

        .status-badge.warning {
            background: #feebc8;
            color: #7c2d12;
        }

        .status-badge.error {
            background: #fed7d7;
            color: #742a2a;
        }

        .status-details {
            color: #666;
            font-size: 14px;
        }

        .status-details div {
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .status-details div:last-child {
            border-bottom: none;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .metric-card {
            background: linear-gradient(135deg, #00D9FF 0%, #00B4D8 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 217, 255, 0.3);
        }

        .metric-card h3 {
            font-size: 16px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .metric-card .value {
            font-size: 36px;
            font-weight: bold;
        }

        .metric-card .unit {
            font-size: 16px;
            opacity: 0.8;
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 30px;
            background: linear-gradient(135deg, #00D9FF 0%, #00B4D8 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 217, 255, 0.4);
            transition: all 0.3s;
        }

        .refresh-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 217, 255, 0.5);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00D9FF, #00B4D8);
            transition: width 0.3s;
        }

        .progress-fill.warning {
            background: linear-gradient(90deg, #ed8936, #dd6b20);
        }

        .progress-fill.error {
            background: linear-gradient(90deg, #f56565, #e53e3e);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 服务状态监控</h1>
            <p>服务运行状态、资源使用情况、性能指标</p>
        </div>

        <div class="content">
            <div class="metrics-grid">
                <div class="metric-card">
                    <h3>CPU 使用率</h3>
                    <div class="value" id="cpuUsage">--</div>
                    <div class="unit">%</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="cpuBar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="metric-card">
                    <h3>内存使用率</h3>
                    <div class="value" id="memoryUsage">--</div>
                    <div class="unit">%</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="memoryBar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="metric-card">
                    <h3>磁盘使用率</h3>
                    <div class="value" id="diskUsage">--</div>
                    <div class="unit">%</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="diskBar" style="width: 0%"></div>
                    </div>
                </div>
                <div class="metric-card">
                    <h3>在线连接数</h3>
                    <div class="value" id="connections">--</div>
                    <div class="unit">个</div>
                </div>
            </div>

            <h2 style="margin-bottom: 20px; color: #333;">🔍 服务状态详情</h2>
            <div class="status-grid" id="statusGrid">
                <div class="loading">正在加载服务状态...</div>
            </div>
        </div>
    </div>

    <button class="refresh-btn" onclick="loadAllStatus()">🔄 刷新状态</button>

    <script>
        const API_BASE = 'http://localhost:8080';

        // 加载所有服务状态
        async function loadAllStatus() {
            await Promise.all([
                loadSystemStatus(),
                loadMetrics()
            ]);
        }

        // 加载系统状态
        async function loadSystemStatus() {
            try {
                const response = await fetch(`${API_BASE}/api/status`);
                const result = await response.json();

                const statusGrid = document.getElementById('statusGrid');
                
                const services = [
                    {
                        name: 'HTTP服务器',
                        status: 'healthy',
                        details: {
                            '状态': result.status === 'ok' ? '运行中' : '异常',
                            '端口': '8080',
                            '版本': result.version || '1.0.0',
                            '时间戳': new Date(result.timestamp).toLocaleString('zh-CN')
                        }
                    },
                    {
                        name: 'WebSocket服务器',
                        status: result.services?.websocket === 'running' ? 'healthy' : 'warning',
                        details: {
                            '状态': result.services?. websocket === 'running' ? '运行中' : '未启动',
                            '端口': '8081',
                            '协议': 'ws://'
                        }
                    },
                    {
                        name: 'COCO数据集服务',
                        status: 'healthy',
                        details: {
                            '状态': '可用',
                            '路径': 'F:\\coco',
                            '类别数': '80',
                            '数据集': 'COCO 2017'
                        }
                    },
                    {
                        name: '数据库服务',
                        status: 'healthy',
                        details: {
                            '状态': '已连接',
                            '类型': 'SQLite3',
                            '文件': 'data/database.db'
                        }
                    }
                ];

                statusGrid.innerHTML = services.map(service => `
                    <div class="status-card ${service.status}">
                        <div class="status-header">
                            <div class="status-title">${service.name}</div>
                            <div class="status-badge ${service.status}">
                                ${service.status === 'healthy' ? '✓ 正常' : service.status === 'warning' ? '⚠ 警告' : '✗ 错误'}
                            </div>
                        </div>
                        <div class="status-details">
                            ${Object.entries(service.details).map(([key, value]) => `
                                <div><strong>${key}:</strong> ${value}</div>
                            `).join('')}
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('加载系统状态失败:', error);
                document.getElementById('statusGrid').innerHTML = 
                    '<div class="error">加载服务状态失败，请稍后重试</div>';
            }
        }

        // 加载性能指标
        async function loadMetrics() {
            try {
                const response = await fetch(`${API_BASE}/api/health`);
                const result = await response.json();

                if (result.status === 'ok') {
                    // 模拟数据（实际应该从服务器获取）
                    const cpu = Math.floor(Math.random() * 30) + 10;
                    const memory = Math.floor(Math.random() * 40) + 30;
                    const disk = Math.floor(Math.random() * 20) + 40;
                    const connections = Math.floor(Math.random() * 50) + 10;

                    document.getElementById('cpuUsage').textContent = cpu;
                    document.getElementById('memoryUsage').textContent = memory;
                    document.getElementById('diskUsage').textContent = disk;
                    document.getElementById('connections').textContent = connections;

                    document.getElementById('cpuBar').style.width = `${cpu}%`;
                    document.getElementById('memoryBar').style.width = `${memory}%`;
                    document.getElementById('diskBar').style.width = `${disk}%`;

                    // 根据使用率设置颜色
                    if (cpu > 70) {
                        document.getElementById('cpuBar').classList.add('warning');
                    }
                    if (memory > 70) {
                        document.getElementById('memoryBar').classList.add('warning');
                    }
                    if (disk > 80) {
                        document.getElementById('diskBar').classList.add('warning');
                    }
                }
            } catch (error) {
                console.error('加载性能指标失败:', error);
            }
        }

        // 页面加载时初始化
        window.addEventListener('DOMContentLoaded', () => {
            loadAllStatus();
            
            // 每30秒自动刷新
            setInterval(loadAllStatus, 30000);
        });
    </script>
</body>
</html>
