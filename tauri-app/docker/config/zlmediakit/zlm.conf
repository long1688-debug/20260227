# ZLMediaKit Configuration
# Place in ZLMediaKit installation directory /conf/

[http]
port=801
sslport=8443
# 增加 POST 内容大小限制（WebRTC SDP 可能较大）
max_req_size=10485760

[rtsp]
port=554
sslport=332
# 强制 RTSP 代理使用 TCP 传输
rtp_type=1

[rtmp]
port=1935

[rtp]
port=8000

[rtp_proxy]
port=10000

[webrtc]
port=8000-9000
tcp_port=8000
enable_webrtc=1
extern_ip=127.0.0.1
ice_timeout=10
max_candidate=10
keep_ice_candidate=1

[sdp]
add_extmap=1

[general]
wait_track_ready_ms=10000
wait_add_track_ms=10000
media_timeout_sec=15

[proxy]
# RTSP 代理配置
# 1: TCP, 0: UDP
rtp_type=1
# 是否启用 TCP 传输
tcp_mode=1
# 接收缓冲区大小
recv_buffer_size=2097152
# 发送缓冲区大小
send_buffer_size=2097152
# 🎯 优化：低延迟配置
# 媒体帧最大缓存时间(毫秒)，降低此值可降低延迟但可能增加卡顿
max_buffer_ms=200
# 是否开启快速启动（不解码首帧）
fast_start=1
# 是否开启丢帧策略（当缓冲过多时丢弃部分帧）
enable_drop=1
# 丢帧阈值(毫秒)，当缓冲超过此值时开始丢帧
drop_threshold_ms=300

[hls]
# HLS 配置（主要用于直播）
# HLS 切片大小(毫秒)，越小延迟越低
segment_duration=1000
# 保留的切片数量
keep_count=3
# 是否启用低延迟模式
low_latency=1

[general]
wait_track_ready_ms=10000
wait_add_track_ms=10000
media_timeout_sec=15
# 🎯 优化：启用 TCP_NODELAY，减少TCP延迟
tcp_nodelay=1