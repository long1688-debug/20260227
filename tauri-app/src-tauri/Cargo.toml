[package]
name = "training-teaching-system"
version = "2.0.0"
description = "实训教学实践系统 - Tauri 版"
authors = ["Training Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
futures-util = { version = "0.3", features = ["async-await", "channel"] }
bcrypt = "0.15"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
camino = "1"
sha2 = "0.10"
sha1 = "0.10"

# 系统信息
sysinfo = "0.30"

# Base64 编码（用于 ONVIF 认证）
base64 = "0.21"

# 查找可执行文件
which = "4"

# 音频处理
cpal = "0.15"
# 字幕解析
regex = "1.10"

# 🎤 Whisper 语音识别（基于 Python subprocess）
hound = "3.5"         # WAV 文件读写

# 音频重采样
rubato = "0.14"

# 随机数生成（用于 ONVIF MessageID）
rand = "0.8"

# 🎯 临时文件支持（用于 RTSP 转码和 Whisper）
tempfile = "3"

# 快速随机数生成（用于 ONVIF）
fastrand = "2"

# 🎯 XML 解析（用于 ONVIF 协议解析）
roxmltree = "0.19"

# 🎯 URL 解析和编码（用于 RTSP 地址处理）
url = "2.5"
percent-encoding = "2.3"

# 图像处理（用于火焰/烟雾检测）
image = "0.25"

# RTSP TLS & digest support
tokio-native-tls = "0.3"
md5 = "0.7"

# 异步 Trait
async-trait = "0.1"

# 日志
log = "0.4"
env_logger = "0.11"

# 全局静态变量
lazy_static = "1.4"

# 🎯 mpv 媒体播放器集成（可选）
radiance-libmpv = { version = "2.0.1", optional = true }

# 网络摄像机发现
tokio-util = { version = "0.7", features = ["full"] }
socket2 = "0.5"
# tokio-util = { version = "0.7", features = ["udp"] }  # 暂时注释掉，因为版本不匹配
# socket2 = "0.5"           # 暂时注释掉，避免潜在冲突

# 网络工具库
if-addrs = "0.9"        # 获取本机网卡信息
ipnet = "2.9"           # IP 子网计算
futures = "0.3"         # 异步流控制

# 🎯 SQLite数据库（用于持久化存储网络摄像机配置）
rusqlite = { version = "0.31", features = ["bundled"] }
whisper-rs = "0.16"
ort = "=2.0.0-rc.15"

# Unix 信号处理（仅 Unix 平台）
[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["signal"] }
libc = "0.2"

# Windows API（用于进程控制）
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["processthreadsapi", "handleapi", "winnt"] }

[patch.crates-io]
# ole32-sys = { path = "patches/ole32-sys" }  # 不再需要

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
mpv = ["dep:radiance-libmpv"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.dev]
opt-level = 0
debug = false
